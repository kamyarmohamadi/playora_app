name: Playora browser preview

on:
  push:
    branches:
      - feature/playora-dashboard-polish-2026-10-19
      - feature/playora-platform-game-plugin-architecture-2026-10-22
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playora-browser-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Verify and publish browser preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build browser preview
        run: npm run build -- --base=/playora_app/
      - name: Publish dist to gh-pages branch without artifact actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/playora-pages
          cp -R dist/. /tmp/playora-pages/
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout --orphan gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/playora-pages/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish Playora browser preview from ${GITHUB_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages --force
