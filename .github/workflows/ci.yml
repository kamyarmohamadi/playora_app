name: Playora quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

# CI jobs only need to read source; do not grant write access to GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  verify:
    name: Tests, types and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test Android OAuth manifest patcher
        run: node --test scripts/configure-android-oauth.node-test.mjs
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Run unit tests
        run: npm test
      - name: Enforce platform/game import boundary
        run: npm run check:platform-boundary
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
      - name: Type-check browser end-to-end tests
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload production web build for manual preview/review
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playora-web-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7


  database-security:
    name: PostgreSQL RLS and wallet privilege tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d playora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: playora_test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Bootstrap minimal Supabase auth test schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_supabase.sql
      - name: Simulate Supabase pgcrypto extension schema
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS extensions;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
          psql -v ON_ERROR_STOP=1 -c 'ALTER EXTENSION pgcrypto SET SCHEMA extensions;'
      - name: Apply member isolation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000000_secure_member_data.sql
      - name: Apply private rooms migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020010000_private_rooms.sql
      - name: Apply social and leaderboard migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020020000_social_and_leaderboard.sql
      - name: Apply match identifier privacy migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020030000_limit_match_uuid_visibility.sql
      - name: Apply account deletion cleanup migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020040000_account_deletion.sql
      - name: Apply platform-only game RPC lockdown migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021000000_platform_only_disable_game_rpc.sql
      - name: Apply public catalog and trusted plugin registry migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022000000_platform_game_plugin_registry.sql
      - name: Apply plugin registry hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000000_plugin_registry_hardening.sql
      - name: Enforce approved artifact origins and plugin publication states
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000100_plugin_origin_state_guards.sql
      - name: Index artifact-origin creator reference
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000200_registry_origin_actor_index.sql
      - name: Store catalog art as metadata
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024000000_catalog_art_key.sql
      - name: Add trusted plugin capability grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025000000_plugin_capability_grants.sql
      - name: Add member-owned support report intake
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026000000_support_reports.sql
      - name: Add capacity-oriented query indexes
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027000000_capacity_query_indexes.sql
      - name: Add player progression and 55-coin welcome grant
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000000_player_progression_economy.sql
      - name: Set the default free wallet grant to 55 coins
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000100_wallet_default_55.sql
      - name: Split Free and Paid progression tracks and migrate signup gift
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000200_economy_tracks_and_value_signup_gift.sql
      - name: Seed both progression tracks for every game and future member
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000300_seed_both_game_tracks.sql
      - name: Add manual deposits, withdrawals and deposit-only turnover
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000400_manual_financial_flows_and_turnover.sql
      - name: Add private finance administrator identities and audit log
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000500_private_finance_admin_control_plane.sql
      - name: Index finance foreign keys and remove duplicate request index
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000600_financial_fk_indexes.sql
      - name: Assert RLS and privileged table permissions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security_invariants.sql
      - name: Verify capacity query indexes are valid
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/capacity_indexes.sql
      - name: Test visible catalog and trusted plugin registry boundaries
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/game_plugin_registry.sql
      - name: Test member-owned support reports, idempotency and rate limits
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/support_reports.sql
      - name: Test wallet ledger idempotency and overdraft protections
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/wallet_ledger.sql
      - name: Test independent Free and Paid progression tracks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/economy_tracks.sql
      - name: Test isolation between two authenticated members
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_member_isolation.sql
      - name: Test ranked Tic Tac Toe matchmaking and server-authoritative outcomes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ranked_tictactoe.sql
      - name: Test private rooms, invite secrecy and no-reward outcomes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/private_rooms.sql
      - name: Test friend requests, anti-spam and leaderboard ordering
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/social_leaderboard.sql
      - name: Test account deletion cleanup without reward side effects
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion.sql
      - name: Test manual financial flows, duplicate transaction claims, turnover and withdrawal limits
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/financial_flows.sql
      - name: Verify finance foreign-key indexes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/financial_fk_indexes.sql
      - name: Verify privileged finance administrator boundary
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/finance_admin_invariants.sql


  edge-functions:
    name: Edge function type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check member self endpoint
        run: deno check --config supabase/functions/member-self/deno.json supabase/functions/member-self/index.ts
      - name: Type-check account deletion endpoint
        run: deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
      - name: Test account deletion request validation
        run: deno test --allow-env --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index_test.ts
      - name: Type-check finance administration endpoint
        run: deno check --config supabase/functions/admin-finance/deno.json supabase/functions/admin-finance/index.ts
      - name: Test finance administration authorization rules
        run: deno test --config supabase/functions/admin-finance/deno.json supabase/functions/admin-finance/authorization_test.ts
